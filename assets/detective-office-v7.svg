<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#15130f"/><stop offset=".48" stop-color="#252017"/><stop offset="1" stop-color="#14100c"/></linearGradient>
 <linearGradient id="oak"><stop stop-color="#17110d"/><stop offset=".28" stop-color="#48321f"/><stop offset=".53" stop-color="#2b1e15"/><stop offset="1" stop-color="#120e0b"/></linearGradient>
 <linearGradient id="floor" x2=".25" y2="1"><stop stop-color="#2c2016"/><stop offset=".25" stop-color="#3c281b"/><stop offset=".7" stop-color="#1e1712"/><stop offset="1" stop-color="#0a0908"/></linearGradient>
 <radialGradient id="beam"><stop stop-color="#d19744" stop-opacity=".56"/><stop offset=".5" stop-color="#b77a34" stop-opacity=".13"/><stop offset="1" stop-color="#9f662c" stop-opacity="0"/></radialGradient>
 <radialGradient id="middlebeam"><stop stop-color="#c29350" stop-opacity=".34"/><stop offset=".65" stop-color="#b98646" stop-opacity=".06"/><stop offset="1" stop-color="#b98646" stop-opacity="0"/></radialGradient>
 <radialGradient id="vignette"><stop offset=".42" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".91"/></radialGradient>
 <filter id="noise"><feTurbulence baseFrequency=".27" numOctaves="3" type="fractalNoise" seed="9" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".19"/></feComponentTransfer></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="plaster" width="38" height="43" patternUnits="userSpaceOnUse"><path d="M3 0v43M22 0v43" stroke="#746143" stroke-opacity=".04"/><path d="M0 18h38" stroke="#000" stroke-opacity=".09"/></pattern>
 <pattern id="woodgr" width="92" height="10" patternUnits="userSpaceOnUse"><path d="M0 2Q25 0 49 3t43-1M0 8Q38 5 64 8t28 0" fill="none" stroke="#c19a61" stroke-opacity=".075" stroke-width=".7"/></pattern>
</defs>
<!-- cracked plaster, panelling, floor of a 1930s archive office -->
